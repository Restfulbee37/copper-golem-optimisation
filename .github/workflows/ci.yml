# Checks every pull request (and every mirrored push) on GitHub's machines: build, unit tests and the in-game
# correctness tests. The workload benchmark needs a dedicated machine, so it runs in the maintainer's own
# pipeline before a pull request is merged (see TESTING.md).
name: Build and test

on:
  pull_request:
  push:
    branches: [main, 'mc/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and correctness tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew build -x runGameTest --console=plain
      - name: In-game correctness tests
        run: ./gradlew runGameTest -Pgametest.filter='copper_golem_mod_test:correctness_tests_*' --console=plain
      - name: Keep the jar and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/run/gameTest/logs/
          retention-days: 14
