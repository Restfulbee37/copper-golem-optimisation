name: Compatibility report
description: Something only goes wrong when another mod is installed alongside this one.
labels: [compatibility]
body:
  - type: input
    id: other-mod
    attributes:
      label: Which mod, and which version?
      placeholder: e.g. Lithium 0.21.4
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What goes wrong?
      description: A crash, golems behaving differently, worse performance, or the game failing to start.
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Copper Golem Optimisation version
      placeholder: e.g. 1.0.0+26.3
    validations:
      required: true
  - type: textarea
    id: switches
    attributes:
      label: Does turning an optimisation off fix it?
      description: Each optimisation can be switched off with /cgp config. If turning one off fixes it, say which one.
  - type: textarea
    id: logs
    attributes:
      label: Crash report or log
      render: text
