# CI/CD for CopperGolemMod
#
# Every commit and merge request:
#   build                 compile, unit tests, jar (job artifact)
#   gametest:correctness  in-game tests: golems behave like vanilla under every config
#   gametest:workload     standard workload benchmark on a copy of a real farm (mod on vs off)
# Tags v<mod version>+<minecraft version>: additionally publish the jar to the package
# registry and create a GitLab Release from the matching CHANGELOG.md section,
# only if all of the above passed.
# Release asset paths can't contain '+', so assets use fixed names, which also
# gives a stable link: /-/releases/permalink/latest/downloads/copper_golem_mod.jar

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch + MR pipelines while an MR is open.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - test
  - publish

variables:
  PACKAGE_NAME: copper_golem_mod
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# Shared settings for every job that runs Gradle.
.gradle:
  image: eclipse-temurin:25-jdk
  interruptible: true
  cache:
    key:
      files:
        - gradle.properties
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/
      - .gradle/loom-cache/
  before_script:
    - chmod +x gradlew
    # Record the machine the results came from (the workload numbers depend on it).
    - echo "CPUs $(nproc), $(awk '/MemTotal/ {printf "%.1f GB RAM", $2/1048576}' /proc/meminfo), $(uname -m)"

build:
  extends: .gradle
  stage: build
  script:
    # The in-game tests run in their own jobs below.
    - ./gradlew build -x runGameTest --console=plain --stacktrace
    - MOD_VERSION="$(./gradlew -q printVersion --console=plain)"
    - MC_VERSION="${MOD_VERSION#*+}"
    - echo "Built version $MOD_VERSION (Minecraft $MC_VERSION)"
    - |
      if [ -n "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_TAG" != "v$MOD_VERSION" ]; then
        echo "Tag '$CI_COMMIT_TAG' does not match the project version 'v$MOD_VERSION' in gradle.properties."
        exit 1
      fi
    - printf 'MOD_VERSION=%s\nMC_VERSION=%s\n' "$MOD_VERSION" "$MC_VERSION" > build.env
  artifacts:
    name: "${PACKAGE_NAME}-${CI_COMMIT_REF_SLUG}"
    paths:
      - build/libs/*.jar
    reports:
      dotenv: build.env
      junit: build/test-results/test/*.xml
    expire_in: 30 days

gametest:correctness:
  extends: .gradle
  stage: test
  needs: []
  script:
    - ./gradlew runGameTest -Pgametest.filter='copper_golem_mod_test:correctness_tests_*' --console=plain --stacktrace
  artifacts:
    when: always
    paths:
      - build/run/gameTest/logs/
    reports:
      junit: build/test-results/gameTest/*.xml
    expire_in: 30 days

gametest:workload:
  extends: .gradle
  stage: test
  needs: []
  timeout: 3h
  script:
    - ./gradlew runGameTest -Pgametest.filter='copper_golem_mod_test:workload_benchmark_*' --console=plain --stacktrace
  artifacts:
    when: always
    name: "workload-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/run/gameTest/copper_golem_mod/workload/
      - build/run/gameTest/logs/
    reports:
      junit: build/test-results/gameTest/*.xml
    expire_in: 90 days

release:
  stage: publish
  image: alpine:3
  needs:
    - job: build
      artifacts: true
    - job: gametest:correctness
      artifacts: false
    - job: gametest:workload
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  script:
    - apk add --no-cache curl jq
    - JAR="${PACKAGE_NAME}-${MOD_VERSION}.jar"
    - test -f "build/libs/$JAR"
    - (cd build/libs && sha256sum "$JAR" > "$JAR.sha256")

    # Release notes: the CHANGELOG.md section whose heading starts with "## [<version>]".
    - |
      awk -v heading="## [$MOD_VERSION]" '
        index($0, heading) == 1 { found = 1; next }
        found && /^## \[/ { exit }
        found { print }
      ' CHANGELOG.md > release_notes.md
    - |
      if ! grep -q '[^[:space:]]' release_notes.md; then
        echo "CHANGELOG.md has no '## [$MOD_VERSION]' section. Add release notes before tagging."
        exit 1
      fi

    # '+' is URL-encoded so the registry path is unambiguous.
    - ENC_VERSION="$(printf '%s' "$MOD_VERSION" | sed 's/+/%2B/g')"
    - ENC_JAR="$(printf '%s' "$JAR" | sed 's/+/%2B/g')"
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${ENC_VERSION}"
    - |
      for file in "$JAR" "$JAR.sha256"; do
        enc_file="$(printf '%s' "$file" | sed 's/+/%2B/g')"
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "build/libs/$file" \
          "${PACKAGE_URL}/${enc_file}"
        echo
      done

    - MILESTONE="${MOD_VERSION%%+*}"
    - |
      jq -n \
        --arg tag "$CI_COMMIT_TAG" \
        --arg name "CopperGolemMod ${MILESTONE} for Minecraft ${MC_VERSION}" \
        --rawfile description release_notes.md \
        --arg milestone "$MILESTONE" \
        --arg jar "$JAR" \
        --arg pkg "$PACKAGE_NAME" \
        --arg jar_url "${PACKAGE_URL}/${ENC_JAR}" \
        --arg sha_url "${PACKAGE_URL}/${ENC_JAR}.sha256" \
        '{
          tag_name: $tag,
          name: $name,
          description: $description,
          milestones: [$milestone],
          assets: { links: [
            { name: $jar, url: $jar_url, link_type: "package", direct_asset_path: ("/" + $pkg + ".jar") },
            { name: ($jar + ".sha256"), url: $sha_url, link_type: "other", direct_asset_path: ("/" + $pkg + ".jar.sha256") }
          ] }
        }' > release.json
    # Re-running the job after a partial failure must not fail on an existing release.
    - |
      ENC_TAG="$(printf '%s' "$CI_COMMIT_TAG" | sed 's/+/%2B/g')"
      if curl --fail --silent --output /dev/null --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${ENC_TAG}"; then
        echo "Release for $CI_COMMIT_TAG already exists; nothing to do."
        exit 0
      fi
    - |
      status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data @release.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases")"
      if [ "$status" != "201" ]; then
        echo "Creating the release failed with HTTP $status:"
        cat response.json
        exit 1
      fi
      jq '{name, tag_name, url: ._links.self}' response.json
