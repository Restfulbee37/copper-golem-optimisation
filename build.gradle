plugins {
    id "fabric-loom" version "1.16.2"
}

// Fabric convention: <mod version>+<Minecraft version>, e.g. 0.2.0+1.21.11
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        copper_golem_mod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Runs JUnit tests inside a Fabric environment (FabricLoader, Minecraft classes, mixins).
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

// In-game tests (Fabric GameTest), in src/gametest. `./gradlew runGameTest` starts a headless test server, runs every
// test and exits non-zero if one fails; `check` (and so `build`) depends on it. Server game tests run in Fabric's
// test mode, which needs no EULA file; client game tests are not used.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "copper_golem_mod_test"
        enableGameTests = true
        enableClientGameTests = false
    }
}

loom {
    runs {
        named("gameTest") {
            // The workload benchmark runs ~1,200 mobs; give the test server room.
            vmArg "-Xmx${project.findProperty("gametest.maxHeap") ?: "4G"}"
            // JUnit-style results that GitLab shows on merge requests.
            property "fabric-api.gametest.report-file", project.layout.buildDirectory.file("test-results/gameTest/TEST-gametest.xml").get().asFile.absolutePath
            // Optional test selection, e.g. -Pgametest.filter=copper_golem_mod_test:correctness_tests_*
            def filter = project.findProperty("gametest.filter")
            if (filter) {
                property "fabric-api.gametest.filter", filter.toString()
            }
            // Optional workload size override, e.g. -Pworkload.stacksPerInput=8
            def stacks = project.findProperty("workload.stacksPerInput")
            if (stacks) {
                property "copper_golem_mod_test.workload.stacksPerInput", stacks.toString()
            }
        }
    }
}

processResources {
    def expansions = [
        version          : project.version,
        minecraft_version: project.minecraft_version,
        loader_version   : project.loader_version
    ]
    inputs.properties expansions

    filesMatching("fabric.mod.json") {
        expand expansions
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// Used by CI to name release artifacts and check that tags match the version.
tasks.register("printVersion") {
    def modVersion = project.version.toString()
    doLast {
        println modVersion
    }
}
