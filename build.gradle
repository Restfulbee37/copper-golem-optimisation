plugins {
    id "fabric-loom" version "1.16.2"
}

// Fabric convention: <mod version>+<Minecraft version>, e.g. 0.2.0+1.21.11
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        copper_golem_mod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Runs JUnit tests inside a Fabric environment (FabricLoader, Minecraft classes, mixins).
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

processResources {
    def expansions = [
        version          : project.version,
        minecraft_version: project.minecraft_version,
        loader_version   : project.loader_version
    ]
    inputs.properties expansions

    filesMatching("fabric.mod.json") {
        expand expansions
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// Used by CI to name release artifacts and check that tags match the version.
tasks.register("printVersion") {
    def modVersion = project.version.toString()
    doLast {
        println modVersion
    }
}
