plugins {
    // Minecraft 26.1+ ships unobfuscated, so this is the non-remapping Loom plugin and there are no mappings.
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

// Fabric convention: <mod version>+<Minecraft version>, e.g. 0.2.0+26.1
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        copper_golem_mod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Runs JUnit tests inside a Fabric environment (FabricLoader, Minecraft classes, mixins).
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

processResources {
    def expansions = [
        version             : project.version,
        minecraft_dependency: project.minecraft_dependency,
        loader_version      : project.loader_version
    ]
    inputs.properties expansions

    filesMatching("fabric.mod.json") {
        expand expansions
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs << "-Xlint:deprecation"
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// Used by CI to name release artifacts and check that tags match the version.
tasks.register("printVersion") {
    def modVersion = project.version.toString()
    doLast {
        println modVersion
    }
}
